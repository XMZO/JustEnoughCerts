version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A module nested in x/crypto with no tags of its own: Dependabot takes
      # x/crypto's tags for its versions and fails to resolve them.
      # workflows/ca-roots.yml watches it instead.
      - dependency-name: golang.org/x/crypto/x509roots/fallback
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The web UI builds on the LTS release of Node that CI uses
      # (.github/actions/setup-web): both move to the next LTS together, by
      # hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint and openapi-typescript do not support TypeScript 7
      # (the native compiler) yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: npm
    # The documentation site.
    directory: /docs/site
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
