version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A module nested in x/crypto with no tags of its own: Dependabot takes
      # x/crypto's tags for its versions and fails to resolve them.
      # workflows/ca-roots.yml watches it instead.
      - dependency-name: golang.org/x/crypto/x509roots/fallback
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint and openapi-typescript do not support TypeScript 7
      # (the native compiler) yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
