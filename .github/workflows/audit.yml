name: audit

# Advisories come out with nothing changed here, so once a week look for
# those that touch the Go modules (govulncheck, which CI also runs on every
# push) and the npm packages of the web UI and the documentation site (pnpm
# audit, which reads the lockfiles; an advisory that no release fixes yet
# is listed in that directory's pnpm-workspace.yaml, with why). Dependabot's
# alerts and security updates are on too; a failed run here names what
# needs a look.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          cache: false

  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [web, docs/site]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm audit
        env:
          DIR: ${{ matrix.dir }}
        run: pnpm -C "$DIR" audit
