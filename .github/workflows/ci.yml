name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Latest stable Go; go.mod only sets the minimum.
  GO_VERSION: stable
  GORELEASER_VERSION: v2.18.3
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  test-arm32:
    # The release builds for 32-bit ARM too, for which GitHub has no runner:
    # its tests run under QEMU, which binfmt_misc starts for each binary.
    name: test (linux/arm/v7, emulated)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm
      - name: go test
        env:
          GOARCH: arm
          GOARM: "7"
        run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Locale files, generated keys, unused keys and CJK text
        run: go run ./tools/i18n check
      - name: Keys come from generated constants
        run: go run ./tools/i18nlint ./...
      - name: A new module builds, and jec builds without any one module
        run: ./scripts/check-modules.sh

  acme:
    name: ACME against Pebble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Start Pebble, the test CA of Let's Encrypt
        run: |
          docker run -d --name pebble -p 14000:14000 -e PEBBLE_VA_ALWAYS_VALID=1 -e PEBBLE_AUTHZREUSE=0 \
            ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble-root.pem"
          for _ in $(seq 30); do
            curl -fs --cacert "$RUNNER_TEMP/pebble-root.pem" https://localhost:14000/dir >/dev/null && exit 0
            sleep 1
          done
          docker logs pebble
          exit 1
      - name: Issue certificates from Pebble
        env:
          JEC_TEST_PEBBLE: https://localhost:14000/dir
        run: JEC_TEST_PEBBLE_ROOT="$RUNNER_TEMP/pebble-root.pem" go test -count=1 -race -run Pebble -v ./internal/modules/acme/

  vulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          cache: false

  workflows:
    name: lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck rhysd/actionlint:1.7.12 scripts/*.sh

  web:
    name: web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-web
      - name: The lego catalog matches lego in go.mod
        run: go run ./tools/legocatalog -check
      - name: The API types match the API
        run: |
          go run ./tools/openapi -check
          pnpm -C web gen:api
          git diff --exit-code web/src/api/schema.d.ts
      - name: Type check
        run: pnpm -C web typecheck
      - name: Lint
        run: pnpm -C web lint
      - name: Unit tests
        run: pnpm -C web test
      - name: Build
        run: pnpm -C web build
      - name: First-load size
        run: pnpm -C web --silent size >>"$GITHUB_STEP_SUMMARY"

  pseudo-locale:
    name: i18n pseudo-locale pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-web
      - name: Build the UI into jec
        run: |
          pnpm -C web build
          go build -o build/jec ./cmd/jec
      - name: Install Chromium
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Every page translated and fitting, at phone and desktop width
        env:
          JEC_E2E_BIN: ${{ github.workspace }}/build/jec
        run: pnpm -C web e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  release-dry-run:
    name: release dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: release
      - uses: ./.github/actions/setup-web
      - name: Build the web UI
        run: pnpm -C web build
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign,sbom
      - name: Stage the image build context
        run: ./scripts/stage-image-context.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/image
          file: Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
      - name: Sizes
        run: |
          {
            echo "## Sizes"
            echo
            ./scripts/release-sizes.sh --packages
          } >>"$GITHUB_STEP_SUMMARY"
