name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # Latest stable Go; go.mod only sets the minimum.
  GO_VERSION: stable
  GORELEASER_VERSION: v2.18.3
  IMAGE: ghcr.io/xmzo/justenoughcerts

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      packages: write # push the image
      id-token: write # keyless cosign signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the history
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          # Built by the dry run of CI on main.
          cache: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Built once; every binary embeds it.
      - uses: ./.github/actions/setup-web
      - name: Build the web UI
        run: pnpm -C web build

      - name: Build binaries and draft the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the image build context
        run: ./scripts/stage-image-context.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # ghcr.io shows the description of a multi-arch image from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # A pre-release only gets its own version and "beta". latest, 1.2
          # and 1 move with stable releases only, and 0 is never tagged.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Just Enough Certs
            org.opencontainers.image.description=Self-hosted SSL/TLS certificate manager: issue, validate, deploy and renew.
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=Just Enough Certs
            org.opencontainers.image.description=Self-hosted SSL/TLS certificate manager: issue, validate, deploy and renew.
            org.opencontainers.image.licenses=MIT
      - id: push
        name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/image
          file: Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          outputs: type=image,push=true,oci-mediatypes=true,compression=gzip,compression-level=9,force-compression=true
      - name: Sign the image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Add sizes to the notes and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          {
            gh release view "$TAG" --json body --jq .body
            echo
            echo "## Sizes"
            echo
            ./scripts/release-sizes.sh "$REF"
          } >notes.md
          gh release edit "$TAG" --notes-file notes.md --draft=false
