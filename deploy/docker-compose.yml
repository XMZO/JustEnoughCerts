# Just Enough Certs, single-file deployment.
#
#   mkdir -p data && sudo chown 65532:65532 data
#   docker compose up -d
#
# The container runs as 65532:65532 and keeps everything in ./data, so that
# directory must be writable by that user, or set "user:" to its owner.
services:
  jec:
    # beta is the newest test release; latest, the newest stable one, comes
    # with 1.0.0, and this file switches to it then.
    image: ghcr.io/xmzo/justenoughcerts:beta
    container_name: jec
    restart: unless-stopped
    # Run as the owner of ./data instead of 65532:65532.
    # user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # The URL users open, when it differs from http://<host>:8080: behind a
      # reverse proxy or under a sub-path. With https the session cookie is
      # sent over HTTPS only.
      # JEC_BASE_URL: "https://certs.example.com"
      # The reverse proxy, whose X-Forwarded-For tells who signs in: an
      # address or a range, such as that of the networks of containers.
      # JEC_TRUSTED_PROXIES: "172.16.0.0/12"
      # Only when the panel is reached over HTTPS alone: browsers then refuse
      # plain HTTP to it for a year.
      # JEC_HSTS: "true"
      # DNS resolvers that find the zones of validation records, when those
      # of the machine answer wrongly, as split-horizon ones do.
      # JEC_DNS_RESOLVERS: "223.5.5.5,119.29.29.29"
    volumes:
      - ./data:/data
      # For the source "certificates on this machine": the directory certbot
      # (or acme.sh) renews them in, read-only. Its keys are usually root's,
      # so JEC has to run as root then: user "0:0" above.
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # For the target "Docker container", which puts certificates into
      # other containers and has them reload: the Docker socket. It gives
      # full control of Docker, so a socket proxy that allows only
      # CONTAINERS=1 and POST=1 is safer (endpoint tcp://<proxy>:2375).
      # - /var/run/docker.sock:/var/run/docker.sock
    # The group that owns the socket, as stat -c %g /var/run/docker.sock
    # prints it, for JEC to use the socket.
    # group_add:
    #   - "999"
