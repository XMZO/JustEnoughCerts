<style>
html body { margin: 0; padding: 0; background: transparent; }
a { color: var(--brand); } a:hover { color: var(--brand-hover); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rows > * { border-bottom: 1px solid var(--line); }
.rows > *:last-child { border-bottom: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; line-height: 20px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-md); color: var(--ink-muted); text-decoration: none; font-weight: 500; }
.nav-item:hover { background: var(--surface-sunken); color: var(--ink); }
.nav-item .jec-icon { width: 18px; height: 18px; }
.nav-item--active, .nav-item--active:hover { background: var(--brand-soft); color: var(--ink); font-weight: 600; }
.nav-item--active .jec-icon { color: var(--brand); }
.seg[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--ink); }
.day th { padding: 10px var(--space-3) 4px; background: var(--surface-raised); color: var(--ink); font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); }
tbody:first-of-type .day th { padding-top: 8px; }
.spin-info .jec-badge--info .jec-icon { animation: jec-spin 1.2s linear infinite; }
</style>
</helmet>

      <a class="nav-item" href="Credentials.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4zM16 7.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0"></path></svg><span>凭据</span></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <a class="nav-item" href="Modules.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1zM10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"></path></svg><span>模块</span></a>
      <a class="nav-item" href="Settings.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"></path></svg><span>设置</span></a>

    </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px 32px;">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">
      <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px;">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600;">签发记录</h1>
          <p style="margin: 0; color: var(--ink-muted);">每一次签发、续期和部署都记在这里，点一行查看完整日志。</p>
        </div>
        <button type="button" class="jec-btn"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10 L12 15 L17 10M12 15L12 3"></path></svg>导出 CSV</button>
      </header>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
        <label style="position: relative; display: block; flex: 1 1 220px; max-width: 280px;">
          <span class="sr-only">搜索域名</span><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 11px; top: 10px; color: var(--ink-muted);"><path d="M3 11a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M21 21l-4.3-4.3"></path></svg>
          <input class="jec-input" type="search" placeholder="搜索域名" style="padding-left: 34px;">
        </label>
        <div role="group" aria-label="按结果筛选" style="display: flex; gap: 6px;">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <button type="button" class="jec-btn jec-btn--sm seg" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}">{{f.label}}<span class="jec-num" style="color: var(--ink-muted); font-weight: 500;">{{f.count}}</span></button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <select class="jec-input" aria-label="操作类型" style="height: 30px; width: auto; padding: 0 8px; font-size: 13px;"><option>全部操作</option><option>签发</option><option>续期</option><option>部署</option></select>
          <select class="jec-input" aria-label="时间范围" style="height: 30px; width: auto; padding: 0 8px; font-size: 13px;"><option>最近 30 天</option><option>最近 7 天</option><option>最近 90 天</option><option>全部</option></select>
        </div>
      </div>
      <div style="overflow-x: auto;">
        <table class="jec-table jec-table--compact spin-info">
          <thead><tr><th scope="col" style="width: 64px;">时间</th><th scope="col">证书</th><th scope="col">操作</th><th scope="col">结果</th><th scope="col">说明</th><th scope="col" style="text-align: right;">用时</th><th scope="col"><span class="sr-only">日志</span></th></tr></thead>
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
            <tbody>
              <tr class="day"><th colspan="7" scope="rowgroup">{{g.day}}</th></tr>
              <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
                <tr>
                  <td class="jec-num" style="color: var(--ink-muted);">{{r.time}}</td>
                  <td><a href="CertDetail.dc.html" style="color: var(--ink); text-decoration: none; font-weight: 600;">{{r.cert}}</a></td>
                  <td>{{r.action}}<span style="margin-left: 6px; font-size: 12px; color: var(--ink-muted);">{{r.trigger}}</span></td>
                  <td><span class="{{r.badge}}"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>{{r.rtext}}</span></td>
                  <td style="max-width: 360px; overflow: hidden; text-overflow: ellipsis; color: var(--ink-muted);">{{r.note}}</td>
                  <td class="jec-num" style="text-align: right; color: var(--ink-muted);">{{r.dur}}</td>
                  <td style="width: 44px;"><a class="jec-btn jec-btn--icon jec-btn--ghost jec-btn--sm" href="Issue.dc.html" aria-label="查看日志"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"></path></svg></a></td>
                </tr>
              </sc-for>
            </tbody>
          </sc-for>
        </table>
      </div>
      <p class="jec-num" style="margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-muted);">{{summary}}</p>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1040}}'>
