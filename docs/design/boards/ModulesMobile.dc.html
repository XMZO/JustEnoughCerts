<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模块 · 手机</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jec/tokens.css">
<link rel="stylesheet" href="ds/jec/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
html body { margin: 0; padding: 0; background: transparent; }
a { color: var(--brand); } a:hover { color: var(--brand-hover); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rows > * { border-bottom: 1px solid var(--line); }
.rows > *:last-child { border-bottom: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; line-height: 20px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500; }
.tab .jec-icon { width: 22px; height: 22px; }
.tab--active { color: var(--brand); font-weight: 600; }
.seg[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--ink); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.mtile { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-raised); min-width: 0; }
.mtile .nm { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtile .ds { font-size: 12px; line-height: 18px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtag { flex: none; display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--radius-sm); font-size: 11px; line-height: 16px; font-weight: 600; background: var(--surface-sunken); color: var(--ink-muted); }
.mtag--exp { background: var(--warn-soft); color: var(--warn-ink); }
.mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; } .mtile { padding: 8px 10px; gap: 8px; min-height: 44px; box-sizing: border-box; } .mtile .ds { display: none; } .mtile .nm { font-size: 13px; } .mtile .mtag:not(.mtag--exp) { display: none; }
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1730px; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 22px;">
  <header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 4px; background: var(--surface-raised); border-bottom: 1px solid var(--line);">
    <a class="jec-btn jec-btn--icon jec-btn--ghost" href="MoreMobile.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: var(--ink);"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 22px; height: 22px;"><path d="M15 18l-6-6 6-6"></path></svg></a><h1 style="flex: 1; margin: 0; font-size: 18px; line-height: 26px; font-weight: 600;">模块</h1>
    
  </header>
  <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div role="group" aria-label="按状态筛选" style="display: flex; gap: 6px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button type="button" class="jec-btn jec-btn--sm seg" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="min-height: 36px; height: 36px; border-radius: 999px;">{{f.label}}<span class="jec-num" style="color: var(--ink-muted); font-weight: 500;">{{f.count}}</span></button></sc-for>
    </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <sc-if value="{{g.has}}" hint-placeholder-val="{{true}}">
          <section class="jec-panel" style="padding: 12px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;"><h2 style="margin: 0; font-size: 16px; line-height: 26px; font-weight: 600;">{{g.title}}</h2><span class="jec-num" style="font-size: 13px; color: var(--ink-muted);">{{g.count}}</span></div>
            <div class="mgrid">
              <sc-for list="{{g.mods}}" as="m" hint-placeholder-count="6">
                <div class="mtile">
                  <div style="flex: 1; min-width: 0;">
                    <div class="nm">{{m.name}}<sc-if value="{{m.builtin}}" hint-placeholder-val="{{false}}"><span class="mtag">内置</span></sc-if><sc-if value="{{m.exp}}" hint-placeholder-val="{{false}}"><span class="mtag mtag--exp">实验</span></sc-if></div>
                    <div class="ds">{{m.desc}}</div>
                  </div>
                  <button type="button" class="jec-switch" role="switch" aria-checked="{{m.on}}" aria-label="{{m.label}}" disabled="{{m.locked}}" onClick="{{m.toggle}}"></button>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-if>
      </sc-for>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding: 4px 8px 20px; background: var(--surface-raised); border-top: 1px solid var(--line);">
    <a class="tab" href="OverviewMobile.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1zM15 3h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1zM15 14h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1zM4 14h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1z"></path></svg>总览</a>
    <a class="tab" href="CertsMobile.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1zM9 12l2 2 4-4"></path></svg>证书</a>
    <a class="tab" href="HistoryMobile.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2"></path></svg>签发记录</a>
    <a class="tab tab--active" href="MoreMobile.dc.html" aria-current="page"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L20 12M4 6L20 6M4 18L20 18"></path></svg>更多</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1730}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: { sslmanager: true, http80: true, azurekv: true }, filter: 'all' };
  }
  renderVals() {
    var self = this;
    var G = [
      { title: '证书来源', mods: [
        ['le', "Let's Encrypt", 'ACME，免费 90 天证书', 'builtin'], ['zerossl', 'ZeroSSL', 'ACME + EAB'], ['gts', 'Google Trust Services', 'ACME + EAB'], ['buypass', 'Buypass', 'ACME，免费 180 天证书'],
        ['sslcom', 'SSL.com', 'ACME + EAB'], ['acme', '其他 ACME', '任意 RFC 8555 兼容的 CA'], ['namecheap', 'Namecheap', '证书商 API，重签已购证书'], ['manual', '手动上传', '粘贴或上传 PEM', 'builtin'],
        ['sslmanager', 'SSL Manager', 'Namecheap 的非公开接口，随时可能变', 'exp']
      ] },
      { title: '域名验证', mods: [
        ['lego', 'DNS 服务商库', '225 个 DNS 服务商，来自 lego'], ['rfc2136', 'RFC 2136', '对接自建 BIND、PowerDNS'], ['script', '自定义脚本', '用你自己的脚本添加和删除记录'],
        ['httpfile', 'HTTP 文件验证', '把验证文件写到网站目录'], ['http80', 'HTTP 内置应答', 'JEC 自己监听 80 端口']
      ] },
      { title: '部署目标', mods: [
        ['esa', '阿里云 ESA', '边缘安全加速'], ['alicdn', '阿里云 CDN', ''], ['slb', '阿里云 SLB', '负载均衡'], ['oss', '阿里云 OSS', '自定义域名证书'],
        ['eo', '腾讯云 EdgeOne', ''], ['tcdn', '腾讯云 CDN', ''], ['clb', '腾讯云 CLB', '负载均衡'], ['qiniu', '七牛云', 'CDN 和存储'],
        ['upyun', '又拍云', 'CDN'], ['hwcdn', '华为云 CDN', ''], ['volc', '火山引擎 CDN', ''], ['cf', 'Cloudflare', '自定义证书，需付费套餐'],
        ['acm', 'AWS ACM', '导入证书'], ['azurekv', 'Azure Key Vault', ''], ['k8s', 'Kubernetes Secret', '写入 TLS Secret'], ['docker', 'Docker 容器', '写入文件后重启容器'],
        ['bt', '宝塔面板', ''], ['1panel', '1Panel', ''], ['ssh', 'SSH', '上传文件并执行命令'], ['local', '本地文件', '写到 JEC 能访问的目录'], ['webhook', 'Webhook', '把证书 POST 给你的服务']
      ] },
      { title: '通知', mods: [
        ['mail', '邮件', 'SMTP'], ['tg', 'Telegram', 'Bot'], ['wecom', '企业微信', '群机器人'], ['dingtalk', '钉钉', '群机器人'],
        ['feishu', '飞书', '群机器人'], ['slack', 'Slack', ''], ['discord', 'Discord', ''], ['bark', 'Bark', 'iOS 推送'],
        ['ntfy', 'ntfy', ''], ['gotify', 'Gotify', ''], ['serverchan', 'Server 酱', '微信推送'], ['nwebhook', 'Webhook', '']
      ] }
    ];
    var off = this.state.off;
    var f = this.state.filter;
    var total = 0, on = 0;
    var groups = G.map(function (g) {
      var gOn = 0;
      var mods = g.mods.map(function (m) {
        var isOn = !off[m[0]];
        total++; if (isOn) { on++; gOn++; }
        return {
          name: m[1], desc: m[2] || ' ', on: isOn ? 'true' : 'false', show: f === 'all' || (f === 'on' ? isOn : !isOn),
          builtin: m[3] === 'builtin', exp: m[3] === 'exp', locked: m[3] === 'builtin',
          label: '启用 ' + m[1],
          toggle: function () { if (m[3] === 'builtin') return; var n = Object.assign({}, self.state.off); n[m[0]] = !n[m[0]]; self.setState({ off: n }); }
        };
      });
      return { title: g.title, count: gOn + ' / ' + g.mods.length + ' 已启用', mods: mods.filter(function (m) { return m.show; }), has: mods.some(function (m) { return m.show; }) };
    });
    var defs = [['all', '全部', total], ['on', '已启用', on], ['off', '已停用', total - on]];
    return {
      theme: this.props.theme ?? 'light',
      groups: groups,
      filters: defs.map(function (d) { return { label: d[1], count: d[2], pressed: f === d[0] ? 'true' : 'false', pick: function () { self.setState({ filter: d[0] }); } }; }),
      summary: '已启用 ' + on + ' 个模块，共 ' + total + ' 个。'
    };
  }
}

</script>
</body>
</html>
