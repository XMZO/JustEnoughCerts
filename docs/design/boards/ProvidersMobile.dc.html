<style>
html body { margin: 0; padding: 0; background: transparent; }
a { color: var(--brand); } a:hover { color: var(--brand-hover); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rows > * { border-bottom: 1px solid var(--line); }
.rows > *:last-child { border-bottom: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; line-height: 20px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500; }
.tab .jec-icon { width: 22px; height: 22px; }
.tab--active { color: var(--brand); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; }
.ico { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--surface-sunken); color: var(--ink-muted); }
.card .t { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .sub { margin-left: 6px; font-weight: 400; font-size: 13px; color: var(--ink-muted); }
.card .detail { font-size: 13px; line-height: 20px; color: var(--ink-muted); }
.card .status { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 600; }
.card .status .jec-icon { width: 14px; height: 14px; }
.card .used { margin-left: auto; font-weight: 400; color: var(--ink-muted); white-space: nowrap; }
.card .actions { display: flex; gap: 6px; padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 10px; }
.add-tile { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 120px; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); background: transparent; color: var(--ink-muted); font: inherit; font-weight: 600; cursor: pointer; }
.add-tile:hover { background: var(--surface-sunken); color: var(--ink); }
.mod { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); font: inherit; font-size: 13px; line-height: 20px; text-align: left; cursor: pointer; }
.mod:hover { background: var(--surface-sunken); }
.mod--on, .mod--on:hover { background: var(--brand-soft); font-weight: 600; }
.dfields { display: grid; gap: 14px; }
.dfields .jec-field { max-width: none; }
.cards { grid-template-columns: minmax(0, 1fr); gap: 10px; }
.card { padding: 12px; }
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 760px; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 22px;">
  <header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 4px; background: var(--surface-raised); border-bottom: 1px solid var(--line);">

    <button type="button" class="jec-btn jec-btn--icon jec-btn--primary" aria-label="{{add}}" onClick="{{openDialog}}" style="width: 44px; height: 44px;"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 20px; height: 20px;"><path d="M5 12h14M12 5v14"></path></svg></button>
  </header>
  <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
    <p style="margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-muted);">{{desc}}</p>
    <div class="jec-list" role="list">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <a class="{{it.mCls}}" href="#" role="listitem" aria-label="{{it.aria}}">
          <span class="jec-item__icon" style="{{it.mIconColor}}"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.stIcon}}"></path></svg></span>
          <span class="jec-item__main"><span class="jec-item__title">{{it.name}}<sc-if value="{{it.hasSub}}" hint-placeholder-val="{{false}}"><span style="margin-left: 6px; font-weight: 400; font-size: 13px; color: var(--ink-muted);">{{it.sub}}</span></sc-if></span><span class="jec-item__meta">{{it.mMeta}}</span></span>
          <span class="jec-item__end"><span class="jec-item__days" style="font-size: 12px; font-weight: 400; color: var(--ink-muted);">{{it.used}}</span></span>
        </a>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 12px; line-height: 18px; color: var(--ink-muted);">{{foot}}</p>
  </div>
  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-modal="true" aria-labelledby="mdlg" style="position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--surface-raised);">
      <div style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 4px; border-bottom: 1px solid var(--line);">
        <button type="button" class="jec-btn jec-btn--icon jec-btn--ghost" aria-label="关闭" onClick="{{closeDialog}}" style="width: 44px; height: 44px;"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 22px; height: 22px;"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        <h2 id="mdlg" style="flex: 1; margin: 0; font-size: 18px; line-height: 26px; font-weight: 600;">{{add}}</h2>
      </div>
      <div style="flex: 1; overflow: auto; padding: 16px; display: grid; align-content: start; gap: 14px;" class="dfields">
        <label class="jec-field"><span class="jec-field__label">类型</span><select class="jec-input"><sc-for list="{{catalog}}" as="m" hint-placeholder-count="5"><option>{{m.name}}</option></sc-for></select></label>
        <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
                <label class="jec-field">
                  <span class="jec-field__label">{{f.label}}</span>
                  <sc-if value="{{f.input}}" hint-placeholder-val="{{true}}"><input class="{{f.inputCls}}" type="{{f.type}}" value="{{f.value}}" placeholder="{{f.placeholder}}"></sc-if>
                  <sc-if value="{{f.select}}" hint-placeholder-val="{{false}}"><select class="jec-input"><option>{{f.value}}</option></select></sc-if>
                  <sc-if value="{{f.area}}" hint-placeholder-val="{{false}}"><textarea class="jec-input jec-code" rows="4" placeholder="{{f.placeholder}}" style="height: auto; padding: 8px 12px;"></textarea></sc-if>
                  <sc-if value="{{f.hasHelp}}" hint-placeholder-val="{{false}}"><span class="jec-field__help">{{f.help}}</span></sc-if>
                </label>
              </sc-for>
              <sc-for list="{{checks}}" as="c" hint-placeholder-count="1">
                <label class="jec-check"><input type="checkbox" checked="{{c.checked}}"><span class="jec-check__text"><span>{{c.label}}</span><sc-if value="{{c.hasHelp}}" hint-placeholder-val="{{false}}"><span class="jec-check__help">{{c.help}}</span></sc-if></span></label>
              </sc-for>
      </div>
      <div style="display: flex; gap: 8px; padding: 10px 16px 24px; border-top: 1px solid var(--line);">
        <sc-if value="{{canTestDialog}}" hint-placeholder-val="{{true}}"><button type="button" class="jec-btn" style="flex: 1;"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"></path></svg>测试连接</button></sc-if>
        <button type="button" class="jec-btn jec-btn--primary" style="flex: 1;" onClick="{{closeDialog}}">保存</button>
      </div>
    </div>
  </sc-if>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding: 4px 8px 20px; background: var(--surface-raised); border-top: 1px solid var(--line);">

    <a class="tab" href="CertsMobile.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1zM9 12l2 2 4-4"></path></svg>证书</a>
    <a class="tab" href="HistoryMobile.dc.html"><svg class="jec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2"></path></svg>签发记录</a>

  </nav>
</div>

          { name: 'cf-main', detail: 'Cloudflare API Token，••••x7Qp', st: 'none', stText: '用于 Cloudflare', used: '10 月 12 日用过' },
          { name: 'namecheap-main', detail: 'Namecheap API Key，••••b21d', st: 'none', stText: '用于 Namecheap', used: '今天 14:20 用过' },
          { name: 'zerossl-eab', detail: 'ACME EAB，kid_••••3f2a', st: 'none', stText: '用于 ZeroSSL', used: '今天 09:31 用过' },
          { name: 'vps-ssh', detail: 'SSH 私钥 ED25519，SHA256:••••Ux4', st: 'none', stText: '用于 Nginx：vps-01、SSH：gw-01', used: '今天 14:22 用过' },
          { name: 'smtp', detail: 'SMTP 用户名和密码', st: 'none', stText: '用于邮件通知', used: '10 月 9 日用过' }
        ],
        catalog: ['腾讯云 API 密钥', '阿里云 AccessKey', 'Cloudflare API Token', 'AWS 访问密钥', 'Namecheap API Key', 'ACME EAB', 'SSH 私钥', '用户名和密码', '通用 Token'],
        more: '',
        pick: 'SSH 私钥',
        fields: [
          { label: '名称', value: 'gw-ssh', help: '' },
          { label: '私钥', value: '', placeholder: '-----BEGIN OPENSSH PRIVATE KEY-----', help: '也可以让 JEC 生成一对新密钥，再把公钥加到服务器的 authorized_keys。', code: true, area: true },
          { label: '口令（可选）', value: '', placeholder: '私钥没有口令就留空', help: '', secret: true }
        ]
      }
    };

    var kind = this.props.kind ?? 'targets';
    var K = KINDS[kind] || KINDS.targets;
    var open = this.state.open === null ? !!this.props.dialog : this.state.open;
    var pick = this.state.pick || K.pick;
    var ST = {
      ok: { icon: I['circle-check'], color: 'var(--ok-ink)' },
      warn: { icon: I['triangle-alert'], color: 'var(--warn-ink)' },
      none: { icon: I['info'], color: 'var(--ink-muted)' }
    };
    var nav = {}, cur = {};
    ['overview', 'certs', 'history', 'sources', 'dns', 'targets', 'notify', 'credentials', 'modules', 'settings'].forEach(function (k) {
      nav[k] = k === kind ? 'nav-item nav-item--active' : 'nav-item';
      cur[k] = k === kind ? 'page' : 'false';
    });
    var isDefaultPick = pick === K.pick;
    var fields = isDefaultPick ? K.fields : [
      { label: '名称', value: pick, help: '' },
      { label: '凭据', value: '新建凭据', help: '这个模块需要的其他字段由它的配置说明自动生成。', select: true }
    ];
    return {
      theme: this.props.theme ?? 'light',
      nav: nav, cur: cur,
      title: K.title, desc: K.desc, add: K.add, foot: K.foot,
      kindIcon: I[K.icon],
      isCred: kind === 'credentials',
      notCred: kind !== 'credentials',
      items: K.items.map(function (it) {
        return {
          name: it.name, sub: it.sub || '', hasSub: !!it.sub, detail: it.detail, stText: it.stText, used: it.used,
          stIcon: ST[it.st].icon, stColor: ST[it.st].color, canTest: it.st !== 'none',
          menu: it.name + ' 的更多操作',
          mCls: it.st === 'warn' ? 'jec-item jec-item--warn' : 'jec-item',
          mIconColor: it.st === 'none' ? 'color: var(--ink-muted);' : '',
          mMeta: it.st === 'warn' ? it.stText : it.detail,
          aria: it.name + '，' + it.stText + '，' + it.used
        };
      }),
      open: open,
      openDialog: function () { self.setState({ open: true }); },
      closeDialog: function () { self.setState({ open: false }); },
      catalog: K.catalog.map(function (c) {
        return { name: c, cls: c === pick ? 'mod mod--on' : 'mod', cur: c === pick ? 'true' : 'false', pick: function () { self.setState({ pick: c }); } };
      }),
      more: K.more, hasMore: !!K.more,
      pick: pick,
      dialogTitle: K.add + '：' + pick,
      fields: fields.map(function (f) {
        return { label: f.label, value: f.value, placeholder: f.placeholder || '', help: f.help, hasHelp: !!f.help, input: !f.select && !f.area, select: !!f.select, area: !!f.area, inputCls: f.code ? 'jec-input jec-code' : 'jec-input', type: f.secret ? 'password' : 'text' };
      }),
      checks: isDefaultPick ? (K.checks || []).map(function (c) { return { label: c.label, help: c.help || '', hasHelp: !!c.help, checked: c.checked }; }) : [],
      canTestDialog: kind !== 'credentials'
    };
  }
}

</script>
